<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩年齡換算器 | 寵物美容貼心小工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Noto Sans TC & Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            50: '#fdfbf7',
                            100: '#f7f0e5',
                            200: '#eedfcc',
                            300: '#e2c8a7',
                            400: '#d5ac7d',
                            500: '#c89158',
                            600: '#ba7748',
                            700: '#9b5e3c',
                            800: '#7e4d37',
                            900: '#674030',
                        },
                        amberCustom: '#f59e0b',
                        cream: '#FFFDF9'
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        rounded: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f7f0e5;
            background-image: radial-gradient(#e2c8a7 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(186, 119, 72, 0.15), 0 8px 10px -6px rgba(186, 119, 72, 0.1);
        }
        .paw-bounce {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-3%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans text-warm-900 antialiased p-4 sm:p-6">

    <!-- 主要內容區 -->
    <main class="max-w-md w-full mx-auto my-auto py-6">
        
        <!-- 標頭品牌卡片 -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-warm-200 text-warm-700 text-3xl mb-3 shadow-inner paw-bounce">
                <i class="fa-solid => fa-paw"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-warm-900 tracking-wide font-rounded">毛孩換算成人類幾歲？</h1>
            <p class="text-warm-600 text-sm mt-1">科學計算狗狗的生理年齡，給狗狗更貼心的照護</p>
        </div>

        <!-- 算算卡片主體 -->
        <div class="bg-cream rounded-3xl p-6 sm:p-8 card-shadow border border-warm-200/60 relative overflow-hidden">
            
            <!-- 可愛裝飾角 -->
            <div class="absolute -top-6 -right-6 w-16 h-16 bg-warm-100 rounded-full opacity-50 pointer-events-none"></div>

            <form id="ageForm" onsubmit="calculateAge(event)" class="space-y-5">
                
                <!-- 1. 狗狗體型選擇 -->
                <div>
                    <label class="block text-sm font-bold text-warm-800 mb-2">
                        <i class="fa-solid fa-dog mr-1 text-warm-500"></i> 請選擇狗狗體型：
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="dogSize" value="small" checked class="peer sr-only">
                            <div class="text-center p-2.5 rounded-2xl border-2 border-warm-200 bg-white peer-checked:border-warm-500 peer-checked:bg-warm-50 peer-checked:text-warm-800 transition-all">
                                <div class="text-xs font-bold">小型犬</div>
                                <div class="text-[10px] text-warm-600">9kg 以下</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="dogSize" value="medium" class="peer sr-only">
                            <div class="text-center p-2.5 rounded-2xl border-2 border-warm-200 bg-white peer-checked:border-warm-500 peer-checked:bg-warm-50 peer-checked:text-warm-800 transition-all">
                                <div class="text-xs font-bold">中型犬</div>
                                <div class="text-[10px] text-warm-600">9-23kg</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="dogSize" value="large" class="peer sr-only">
                            <div class="text-center p-2.5 rounded-2xl border-2 border-warm-200 bg-white peer-checked:border-warm-500 peer-checked:bg-warm-50 peer-checked:text-warm-800 transition-all">
                                <div class="text-xs font-bold">大型犬</div>
                                <div class="text-[10px] text-warm-600">23kg 以上</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 2. 狗狗實際年齡輸入 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="dogAge" class="block text-sm font-bold text-warm-800">
                            <i class="fa-solid fa-cake-candles mr-1 text-warm-500"></i> 狗狗實際年齡 (歲)：
                        </label>
                        <span id="ageDisplay" class="text-sm font-bold text-warm-600 bg-warm-100 px-2.5 py-0.5 rounded-full">1 歲</span>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <input type="range" id="dogAgeSlider" min="0.5" max="20" step="0.5" value="1" 
                            class="w-full h-2.5 bg-warm-200 rounded-lg appearance-none cursor-pointer accent-warm-600"
                            oninput="syncAgeInput(this.value)">
                    </div>
                    
                    <div class="flex justify-between text-[11px] text-warm-600 px-1 mt-1">
                        <span>0.5 歲</span>
                        <span>10 歲</span>
                        <span>20 歲</span>
                    </div>
                </div>

                <!-- 3. 計算按鈕 -->
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-warm-500 to-warm-600 hover:from-warm-600 hover:to-warm-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center text-base">
                    <i class="fa-solid fa-calculator mr-2"></i> 開始換算年齡
                </button>
            </form>

            <!-- 計算結果顯示區 (預設隱藏或流暢展開) -->
            <div id="resultContainer" class="hidden mt-6 pt-6 border-t border-dashed border-warm-200 animate-fade-in">
                <div class="text-center">
                    <p class="text-xs text-warm-600 uppercase tracking-widest font-semibold">換算結果</p>
                    <div class="mt-2 flex items-baseline justify-center">
                        <span class="text-sm text-warm-700 font-bold mr-1">相當於人類</span>
                        <span id="humanAgeResult" class="text-4xl font-extrabold text-warm-700 font-rounded mx-1">--</span>
                        <span class="text-lg text-warm-700 font-bold ml-1">歲</span>
                    </div>

                    <!-- 生命階段標籤 -->
                    <div class="mt-3">
                        <span id="stageBadge" class="inline-block px-3 py-1 bg-warm-100 text-warm-800 text-xs font-bold rounded-full border border-warm-200">
                            幼犬期
                        </span>
                    </div>

                    <!-- 美容師貼心建議 -->
                    <div class="mt-4 bg-warm-50/80 p-3.5 rounded-2xl border border-warm-200/50 text-left">
                        <p class="text-xs font-bold text-warm-800 mb-1 flex items-center">
                            <i class="fa-solid fa-heart-pulse text-rose-400 mr-1.5"></i> 美容師小提醒：
                        </p>
                        <p id="careAdvice" class="text-xs text-warm-700 leading-relaxed">
                            載入中...
                        </p>
                    </div>
                </div>
            </div>

        </div>

        <!-- 頁尾貼心提示 -->
        <footer class="text-center mt-6 text-xs text-warm-600">
            <p>💡 計算公式基於美國獸醫醫學會 (AVMA) 生理發展研究換算</p>
            <p class="mt-1">寵物美容工作室 · 關心您的毛孩健康</p>
        </footer>

    </main>

    <script>
        // 同步 Slider 與顯示文字
        function syncAgeInput(val) {
            document.getElementById('ageDisplay').innerText = val + ' 歲';
        }

        // 換算核心邏輯
        function calculateAge(e) {
            e.preventDefault();

            const size = document.querySelector('input[name="dogSize"]:checked').value;
            const age = parseFloat(document.getElementById('dogAgeSlider').value);

            let humanAge = 0;

            // AVMA 標準換算邏輯：
            // 第一年 ≒ 15 歲
            // 第二年 ≒ 9 歲 (累積 24 歲)
            // 之後每年根據體型增加：小型犬 +4歲 / 中型犬 +5歲 / 大型犬 +6~7歲
            if (age <= 1) {
                humanAge = age * 15;
            } else if (age <= 2) {
                humanAge = 15 + (age - 1) * 9;
            } else {
                humanAge = 24;
                const extraYears = age - 2;
                if (size === 'small') {
                    humanAge += extraYears * 4;
                } else if (size === 'medium') {
                    humanAge += extraYears * 5;
                } else { // large
                    humanAge += extraYears * 6;
                }
            }

            humanAge = Math.round(humanAge);

            // 判斷生命階段與建議
            let stageText = '';
            let careAdvice = '';

            if (humanAge < 12) {
                stageText = '🐶 幼犬期 (Puppy)';
                careAdvice = '狗狗目前好奇心強、充滿活力！建議多做社會化訓練，美容時可選擇基礎洗澡，讓牠習慣碰觸耳朵與爪子。';
            } else if (humanAge < 20) {
                stageText = '🐾 青少年期 (Junior)';
                careAdvice = '體能發展迅速，精力旺盛。洗澡梳毛時可順便檢查皮膚是否有異狀，適當消耗精力能讓美容更順利喔！';
            } else if (humanAge < 50) {
                stageText = '✨ 壯年期 (Adult)';
                careAdvice = '生理狀態最為穩定成熟。建議定期護理毛髮防結毛，並依犬種進行腳底毛修剪與洗耳保養。';
            } else if (humanAge < 65) {
                stageText = '🍃 中老年期 (Mature)';
                careAdvice = '體力開始稍微減退，關節可能較敏感。美容時洗澡水溫宜溫和，並注意防滑與吹乾時的耐心陪伴。';
            } else {
                stageText = '👑 高齡犬期 (Senior)';
                careAdvice = '步入高齡，需要更多關懷與細心照顧！美容時間不宜過長，動作需輕柔，特別注意關節保暖與皮膚保濕。';
            }

            // 顯示結果
            document.getElementById('humanAgeResult').innerText = humanAge;
            document.getElementById('stageBadge').innerText = stageText;
            document.getElementById('careAdvice').innerText = careAdvice;

            const resultBox = document.getElementById('resultContainer');
            resultBox.classList.remove('hidden');
            
            // 平滑滾動到結果區（適用於小螢幕）
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
